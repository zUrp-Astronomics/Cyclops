name: Cyclops
tagline: >-
  An autonomous plate-solving finder: your visual telescope always knows where it points, with no
  imaging camera and no laptop.
slogan: One eye to find them all
category: Camera
section: cameras          # mounts | cameras | gadgets | future
status: future            # wip | future | released — décidé par l'humain
basedOn: diofinder

description:
  - >-
    Cyclops is an autonomous astrometry finder: a Raspberry Pi Zero 2 W and an HQ camera behind a
    telephoto lens, riding on the tube and plate-solving the sky to know exactly where your
    telescope is pointing.
  - >-
    Based on the diofinder project. It talks to the mount and to your phone, so a purely visual
    telescope gets precise pointing with no imaging camera and no laptop in the field. Status:
    design phase.

poster: cyclops.webp      # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Cyclops poster on a worn, chipped cream plate: a hulking mechanical giant in yellow and steel
  armour plates bristling with spikes, a single glowing yellow lens for an eye, looms in front of
  the full moon, yellow rays and blueprint sketches of itself, above the slogan “One eye to find
  them all”.
accent: '#fbd102'         # couleur des rayons de l'affiche
